include /etc/nginx/modules/*.conf;

worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;
  sendfile on;
  server_tokens off;
  charset utf-8;

  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 5;
  gzip_min_length 256;
  gzip_types text/plain text/css text/xml application/javascript application/json image/svg+xml application/xml application/xml+rss;

  brotli on;
  brotli_comp_level 5;
  brotli_min_length 256;
  brotli_types text/plain text/css text/xml application/javascript application/json image/svg+xml application/xml application/xml+rss;

  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;

  server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    error_page 404 /404.html;

    location = /404.html {
      include /etc/nginx/security-headers.conf;
      internal;
    }

    location ~* "^/assets/.+\.[a-f0-9]{8}\.(css|js|svg|png|webp|woff2)$" {
      include /etc/nginx/security-headers.conf;
      add_header Cache-Control "public, max-age=31536000, immutable" always;
      try_files $uri =404;
    }

    location /assets/ {
      include /etc/nginx/security-headers.conf;
      add_header Cache-Control "public, max-age=86400" always;
      try_files $uri =404;
    }

    location /pagefind/ {
      include /etc/nginx/security-headers.conf;
      add_header Cache-Control "public, max-age=86400" always;
      try_files $uri =404;
    }

    location / {
      include /etc/nginx/security-headers.conf;
      add_header Cache-Control "public, max-age=300" always;
      try_files $uri $uri/index.html =404;
    }
  }
}
